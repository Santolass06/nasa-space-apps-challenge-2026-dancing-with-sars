name: Bug report
description: Something is broken or behaves unexpectedly
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including the study area or endpoint involved.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `make dev`
        2. Open http://localhost:5173
        3. …
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python/Node version, browser.
      placeholder: "Ubuntu 24.04, Python 3.11, Node 20, Firefox 130"

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
