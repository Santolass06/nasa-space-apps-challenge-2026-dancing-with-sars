name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pipeline:
    name: Pipeline (lint + grid check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff and numpy
        run: pip install ruff numpy

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Grid self-check
        run: python -m caramulo.grid

      - name: Export self-check
        run: python -m caramulo.export

      - name: Caveats self-check
        run: python -m caramulo.caveats

  web:
    name: Web (type-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check and build
        run: npm run build
