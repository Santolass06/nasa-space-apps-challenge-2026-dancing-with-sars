[project]
name = "caramulo-pipeline"
version = "0.1.0"
description = "Offline NISAR pipeline for Caramulo em chamas (NASA Space Apps Challenge 2026)"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "asf_search",
  "earthaccess",
  "h5py",
  "numpy",
  "rasterio",
  "geopandas",
  "shapely",
  "scipy",
  "pystac-client",
]

[dependency-groups]
dev = ["ruff"]

[tool.uv]
# Scripts run from this folder (`uv run python run.py`); there is nothing to install.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
